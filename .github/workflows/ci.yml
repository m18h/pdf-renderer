name: CI

on:
  schedule:
    # Weekly drift catch-all. Dependabot (see .github/dependabot.yml) is what
    # actually keeps the Chromium base image current — a cron against a pinned
    # tag only produces bit-identical rebuilds.
    - cron: '32 3 * * 1'
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep in sync with the Dockerfile runtime stage.
  HEADLESS_SHELL_IMAGE: chromedp/headless-shell:151.0.7922.109

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -count=1 ./...

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pull the headless-shell binary out of the published image rather than
      # apt-installing Chromium: it is the exact binary the runtime stage uses,
      # and it needs no X11/D-Bus.
      - name: Extract headless-shell
        run: |
          docker create --name hs "$HEADLESS_SHELL_IMAGE"
          docker cp hs:/headless-shell /tmp/headless-shell
          docker rm hs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libexpat1 libfontconfig1 libuuid1 \
            fonts-liberation fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - name: Browser integration tests
        env:
          PDFRENDER_EXEC_PATH: /tmp/headless-shell/headless-shell
          # GitHub runners deny clone(CLONE_NEWUSER) under the default seccomp
          # profile, so the namespace sandbox cannot start here.
          PDFRENDER_NO_SANDBOX: "1"
        run: go test -race -count=1 -tags browser -timeout 15m ./...

  build:
    needs: [lint, test, test-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A v2.0.0 tag publishes 2.0.0, 2.0, 2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short

      # Single-arch, loaded locally, so the smoke job can actually run it.
      - name: Build for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: pdf-renderer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: ./deploy/smoke.sh pdf-renderer:smoke

      # Builds a CJK-less variant and proves a mounted font is actually embedded
      # in the output, rather than merely that the request succeeded.
      - name: Smoke test runtime font mounting
        run: ./deploy/smoke-fonts.sh pdf-renderer:smoke

      # Multi-arch push. The runtime stage's font install runs under QEMU for
      # the non-native arch; expect this step to be slow.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the binary, so `pdf-renderer -version` reports the release
          # rather than "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
