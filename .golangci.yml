# golangci-lint configuration (schema v2 — the `version` key is required as of v2.0.0)
version: "2"

run:
  timeout: 5m
  # Integration tests live behind this tag; lint them too.
  build-tags:
    - browser

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign

  settings:
    gosec:
      excludes:
        # G114/G112: server timeouts are set explicitly where it matters.
        - G114
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Tests legitimately ignore Close errors, use httptest.NewRequest, and
      # shell out without a context. None of that matters in a test binary.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/m18h/pdf-renderer
